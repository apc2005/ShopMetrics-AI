<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopMetrics AI — History</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/history.css">
    <script src="/js/storage.js"></script>
    <script src="/js/layout.js"></script>
</head>
<body>
    <main class="main">
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                renderTopbar('Analysis History', 'Past uploads and results');
                loadHistory();
            });
        </script>
        
        <div class="content" id="page-content">
            <div class="section-header">
                <div class="section-title">Archived Analyses</div>
                <div class="topbar-actions">
                    <a href="/index.html">
                        <button class="btn-primary" style="background: var(--bg-surface); color: var(--text-primary); border: 1px solid var(--border);">
                            <i class="fas fa-plus"></i> New Analysis
                        </button>
                    </a>
                </div>
            </div>
            
            <div id="historyContainer" class="history-grid">
            </div>
        </div>
    </main>

    <script>
        function formatDate(isoString) {
            const date = new Date(isoString);
            return new Intl.DateTimeFormat('en-US', {
                month: 'short', day: 'numeric', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            }).format(date);
        }

        async function loadHistory() {
            const container = document.getElementById('historyContainer');
            try {
                const history = await window.appStorage.getAllHistory();
                
                if (!history || history.length === 0) {
                    container.innerHTML = `
                        <div style="grid-column: 1 / -1;" class="empty-history">
                            <div class="empty-icon"><i class="fas fa-inbox"></i></div>
                            <h3>No history found</h3>
                            <p style="margin-top: 8px;">You haven't analyzed any datasets yet.</p>
                            <a href="/index.html" style="text-decoration:none; display:inline-block; margin-top:20px;">
                                <button class="btn-primary">Upload Dataset</button>
                            </a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = history.map(item => `
                    <div class="history-card" onclick="openAnalysis(${item.id})">
                        <div class="hc-header">
                            <div class="hc-icon"><i class="fas fa-file-csv"></i></div>
                            <div class="hc-title-wrapper">
                                <div style="display:flex; align-items:center;">
                                    <div class="hc-filename" title="${item.filename}">${item.filename}</div>
                                    <button onclick="editAnalysisName(event, ${item.id}, '${item.filename.replace(/'/g, "\\'")}')" style="background:none; border:none; color:var(--text-muted); cursor:pointer; margin-left:8px;" title="Rename">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                </div>
                                <div class="hc-date"><i class="far fa-clock"></i> ${formatDate(item.date)}</div>
                            </div>
                            <button class="hc-delete" onclick="deleteAnalysis(event, ${item.id})" title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                        <div class="hc-stats">
                            <div class="hc-stat">
                                <div class="hc-stat-val">${(item.rows || 0).toLocaleString()}</div>
                                <div class="hc-stat-label">Total Rows</div>
                            </div>
                            <div class="hc-stat">
                                <div class="hc-stat-val" style="color:var(--green)">$${formatShort(item.kpis?.['Ventas Totales'])}</div>
                                <div class="hc-stat-label">Total Revenue</div>
                            </div>
                        </div>
                        <div class="hc-action">
                            View Dashboard <i class="fas fa-arrow-right" style="margin-left:6px;font-size:10px;"></i>
                        </div>
                    </div>
                `).join('');
                
            } catch (err) {
                console.error(err);
                container.innerHTML = `<p style="color:red">Failed to load history.</p>`;
            }
        }

        function formatShort(num) {
            if (!num) return '0';
            if (num >= 1e6) return (num/1e6).toFixed(1) + 'M';
            if (num >= 1e3) return (num/1e3).toFixed(1) + 'K';
            return parseFloat(num).toFixed(0);
        }

        window.openAnalysis = function(id) {
            window.appStorage.setCurrentAnalysisId(id);
            window.location.href = '/pages/overview.html';
        };

        window.deleteAnalysis = async function(event, id) {
            event.stopPropagation();
            showConfirm('¿Eliminar este análisis del historial?', async () => {
                await window.appStorage.deleteHistory(id);
                const currentId = localStorage.getItem('currentAnalysisId');
                if (currentId == id) localStorage.removeItem('currentAnalysisId');
                notifService.add('Análisis eliminado del historial', 'delete');
                showToast('Análisis eliminado', 'info');
                loadHistory();
            });
        };

        window.editAnalysisName = async function(event, id, currentName) {
            event.stopPropagation();
            showPromptModal('Renombrar análisis', 'Nuevo nombre:', currentName, async (newName) => {
                if (newName && newName.trim() !== '' && newName !== currentName) {
                    try {
                        await window.appStorage.updateFilename(id, newName.trim());
                        notifService.add('Análisis renombrado: "' + newName.trim() + '"', 'rename');
                        showToast('Nombre actualizado correctamente', 'success');
                        loadHistory();
                    } catch (err) {
                        console.error("Error updating name:", err);
                        showToast('No se pudo actualizar el nombre', 'error');
                    }
                }
            });
        };

        // Modal de confirmación bonito
        function showConfirm(msg, onConfirm) {
            const el = document.createElement('div');
            el.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:9998;backdrop-filter:blur(4px);';
            el.innerHTML = `
                <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:28px 32px;max-width:360px;width:90%;box-shadow:0 24px 64px rgba(0,0,0,0.5);">
                    <div style="font-size:15px;font-weight:700;margin-bottom:8px;"><i class="fas fa-trash" style="color:var(--red);margin-right:8px;"></i>Confirmar eliminación</div>
                    <div style="font-size:13px;color:var(--text-secondary);margin-bottom:24px;">${msg}</div>
                    <div style="display:flex;gap:10px;justify-content:flex-end;">
                        <button onclick="this.closest('div[style*=fixed]').remove()" style="background:var(--bg-surface);color:var(--text-secondary);border:1px solid var(--border);border-radius:8px;padding:8px 18px;font-size:13px;cursor:pointer;">Cancelar</button>
                        <button id="confirm-ok" style="background:var(--red);color:white;border:none;border-radius:8px;padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer;">Eliminar</button>
                    </div>
                </div>`;
            document.body.appendChild(el);
            el.querySelector('#confirm-ok').onclick = () => { el.remove(); onConfirm(); };
        }

        // Modal de input bonito
        function showPromptModal(title, label, defaultVal, onOk) {
            const el = document.createElement('div');
            el.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:9998;backdrop-filter:blur(4px);';
            el.innerHTML = `
                <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:28px 32px;max-width:400px;width:90%;box-shadow:0 24px 64px rgba(0,0,0,0.5);">
                    <div style="font-size:15px;font-weight:700;margin-bottom:16px;"><i class="fas fa-edit" style="color:var(--amber);margin-right:8px;"></i>${title}</div>
                    <div style="font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px;">${label}</div>
                    <input id="prompt-input" type="text" value="${defaultVal}" style="width:100%;padding:9px 12px;background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:13px;font-family:inherit;outline:none;margin-bottom:20px;">
                    <div style="display:flex;gap:10px;justify-content:flex-end;">
                        <button onclick="this.closest('div[style*=fixed]').remove()" style="background:var(--bg-surface);color:var(--text-secondary);border:1px solid var(--border);border-radius:8px;padding:8px 18px;font-size:13px;cursor:pointer;">Cancelar</button>
                        <button id="prompt-ok" style="background:var(--accent);color:white;border:none;border-radius:8px;padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer;">Guardar</button>
                    </div>
                </div>`;
            document.body.appendChild(el);
            el.querySelector('#prompt-input').focus();
            el.querySelector('#prompt-ok').onclick = () => { const v = el.querySelector('#prompt-input').value; el.remove(); onOk(v); };
            el.querySelector('#prompt-input').addEventListener('keydown', e => { if(e.key === 'Enter') { const v = el.querySelector('#prompt-input').value; el.remove(); onOk(v); } });
        }
    </script>
</body>
</html>
