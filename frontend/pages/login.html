<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopMetrics AI — Iniciar sesión</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <div class="auth-container">
        <!-- Logo -->
        <div class="auth-brand">
            <div class="auth-brand-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 32 32">
                    <rect x="3" y="19" width="5" height="7" rx="1.5" fill="rgba(255,255,255,0.5)"/>
                    <rect x="11" y="13" width="5" height="13" rx="1.5" fill="rgba(255,255,255,0.78)"/>
                    <rect x="19" y="7" width="5" height="19" rx="1.5" fill="white"/>
                    <path d="M5.5 19.5 L13.5 13.5 L21.5 7.5" stroke="rgba(196,181,253,0.9)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="21.5" cy="7.5" r="2.2" fill="#c4b5fd"/>
                </svg>
            </div>
            <div class="auth-brand-name">ShopMetrics AI</div>
            <div class="auth-brand-sub">Analytics Platform</div>
        </div>

        <!-- Card -->
        <div class="auth-card">
            <div class="auth-title">Bienvenido/a de nuevo</div>
            <div class="auth-sub">Inicia sesión para acceder a tu dashboard</div>

            <div class="auth-error" id="errorMsg">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText"></span>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="field">
                    <div class="field-label">Email</div>
                    <div class="field-wrap">
                        <i class="fas fa-envelope field-icon"></i>
                        <input class="field-input" type="email" id="email" placeholder="tu@email.com" required autocomplete="email">
                    </div>
                </div>
                <div class="field">
                    <div class="field-label">Contraseña</div>
                    <div class="field-wrap">
                        <i class="fas fa-lock field-icon"></i>
                        <input class="field-input" type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                </div>

                <button class="btn-auth" type="submit" id="submitBtn">
                    <div class="spinner" id="spinner"></div>
                    <span id="btnText"><i class="fas fa-sign-in-alt"></i> Iniciar sesión</span>
                </button>
            </form>

            <div class="auth-footer">
                ¿No tienes cuenta? <a href="/pages/register.html">Regístrate gratis</a>
            </div>
        </div>
    </div>

    <script>
        // Si ya tienes sesión, te mandamos directamente al dashboard
        const currentUser = localStorage.getItem('sm_user');
        if (currentUser) {
            window.location.href = '/index.html';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn      = document.getElementById('submitBtn');
            const spinner  = document.getElementById('spinner');
            const btnText  = document.getElementById('btnText');

            // Desactivamos el botón y mostramos el spinner mientras espera
            btn.disabled = true;
            spinner.style.display = 'block';
            btnText.style.display = 'none';
            hideError();

            try {
                const res = await fetch('https://shopmetrics-ai-1.onrender.com/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (!res.ok) {
                    showError(data.error || 'Error al iniciar sesión');
                    return;
                }

                // Guardar usuario en localStorage
                localStorage.setItem('sm_user', JSON.stringify(data));
                window.location.href = '/index.html';

            } catch (err) {
                showError('No se puede conectar con el servidor. ¿Está el backend arrancado?');
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.style.display = 'inline';
            }
        }

        function showError(msg) {
            document.getElementById('errorText').textContent = msg;
            document.getElementById('errorMsg').classList.add('show');
        }
        function hideError() {
            document.getElementById('errorMsg').classList.remove('show');
        }
    </script>
</body>
</html>
