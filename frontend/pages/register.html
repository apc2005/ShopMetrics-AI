<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopMetrics AI — Crear cuenta</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/register.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-brand">
            <div class="auth-brand-icon">🛒</div>
            <div class="auth-brand-name">ShopMetrics AI</div>
            <div class="auth-brand-sub">Analytics Platform</div>
        </div>

        <div class="auth-card">
            <div id="formView">
                <div class="auth-title">Crear Cuenta</div>
                <div class="auth-sub">Empieza a analizar tu negocio hoy mismo</div>

                <div class="auth-error" id="errorMsg">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorText"></span>
                </div>

                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div class="field">
                        <div class="field-label">Nombre completo</div>
                        <div class="field-wrap">
                            <i class="fas fa-user field-icon"></i>
                            <input class="field-input" type="text" id="name" placeholder="Tu nombre" required autocomplete="name">
                        </div>
                    </div>
                    <div class="field">
                        <div class="field-label">Email</div>
                        <div class="field-wrap">
                            <i class="fas fa-envelope field-icon"></i>
                            <input class="field-input" type="email" id="email" placeholder="tu@email.com" required autocomplete="email">
                        </div>
                    </div>
                    <div class="field">
                        <div class="field-label">Contraseña</div>
                        <div class="field-wrap">
                            <i class="fas fa-lock field-icon"></i>
                            <input class="field-input" type="password" id="password" placeholder="Mínimo 6 caracteres" required autocomplete="new-password" oninput="checkStrength(this.value)">
                        </div>
                        <div class="password-strength" id="strengthWrap">
                            <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                            <div class="strength-text" id="strengthText"></div>
                        </div>
                    </div>
                    <div class="field">
                        <div class="field-label">Confirmar contraseña</div>
                        <div class="field-wrap">
                            <i class="fas fa-lock field-icon"></i>
                            <input class="field-input" type="password" id="passwordConfirm" placeholder="Repite la contraseña" required autocomplete="new-password">
                        </div>
                    </div>

                    <button class="btn-auth" type="submit" id="submitBtn">
                        <div class="spinner" id="spinner"></div>
                        <span id="btnText"><i class="fas fa-user-plus"></i> Crear cuenta</span>
                    </button>
                </form>

                <div class="terms">Al registrarte aceptas usar esta plataforma de forma responsable 🙂</div>

                <div class="auth-footer">
                    ¿Ya tienes cuenta? <a href="/pages/login.html">Iniciar sesión</a>
                </div>
            </div>

            <!-- Estado de éxito -->
            <div class="auth-success" id="successView">
                <div class="success-icon"><i class="fas fa-check"></i></div>
                <div style="font-size:18px;font-weight:700;margin-bottom:6px;">¡Cuenta creada!</div>
                <div style="font-size:13px;color:var(--text-secondary);margin-bottom:20px;">Redirigiendo al dashboard...</div>
                <div class="spinner" style="display:block;margin:0 auto;"></div>
            </div>
        </div>
    </div>

    <script>
        // Si ya tienes sesión, no necesitas registrarte, te mandamos al dashboard
        if (localStorage.getItem('sm_user')) {
            window.location.href = '/index.html';
        }

        function checkStrength(val) {
            const wrap = document.getElementById('strengthWrap');
            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');
            if (!val) { wrap.style.display = 'none'; return; }
            wrap.style.display = 'block';

            let score = 0;
            if (val.length >= 6)  score++;
            if (val.length >= 10) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            const levels = [
                { pct: '20%', color: '#ef4444', label: 'Muy débil' },
                { pct: '40%', color: '#f59e0b', label: 'Débil' },
                { pct: '60%', color: '#f59e0b', label: 'Regular' },
                { pct: '80%', color: '#10b981', label: 'Buena' },
                { pct: '100%', color: '#10b981', label: '¡Fuerte!' },
            ];
            const lvl = levels[Math.min(score - 1, 4)] || levels[0];
            fill.style.width = lvl.pct;
            fill.style.background = lvl.color;
            text.textContent = lvl.label;
            text.style.color = lvl.color;
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name     = document.getElementById('name').value.trim();
            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm  = document.getElementById('passwordConfirm').value;

            hideError();

            if (password !== confirm) {
                showError('Las contraseñas no coinciden');
                return;
            }
            if (password.length < 6) {
                showError('La contraseña debe tener al menos 6 caracteres');
                return;
            }

            const btn     = document.getElementById('submitBtn');
            const spinner = document.getElementById('spinner');
            const btnText = document.getElementById('btnText');
            btn.disabled = true;
            spinner.style.display = 'block';
            btnText.style.display = 'none';

            try {
                const res = await fetch('http://localhost:5050/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();

                if (!res.ok) {
                    showError(data.error || 'Error al crear la cuenta');
                    return;
                }

                // Guardamos los datos del usuario en el navegador y redirigimos
                localStorage.setItem('sm_user', JSON.stringify(data));

                // Ocultamos el formulario y mostramos la pantalla de confirmación
                document.getElementById('formView').style.display = 'none';
                document.getElementById('successView').style.display = 'block';

                setTimeout(() => {
                    window.location.href = '/index.html';
                }, 1500);

            } catch (err) {
                showError('No se puede conectar con el servidor. ¿Está el backend arrancado?');
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.style.display = 'inline';
            }
        }

        function showError(msg) {
            document.getElementById('errorText').textContent = msg;
            document.getElementById('errorMsg').classList.add('show');
        }
        function hideError() {
            document.getElementById('errorMsg').classList.remove('show');
        }
    </script>
</body>
</html>
